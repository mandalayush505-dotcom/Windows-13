<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 13 Concept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .start-menu {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        .start-menu.open {
            transform: translateY(0);
        }
        .app-icon:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body class="h-screen w-screen text-white select-none">

    <!-- Desktop Icons -->
    <div class="p-4 grid grid-cols-1 gap-8 w-24">
        <div class="flex flex-col items-center gap-1 group cursor-pointer" onclick="toggleWindow('files')">
            <div class="p-3 rounded-lg group-hover:bg-white/10 transition">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400"></i>
            </div>
            <span class="text-xs shadow-sm">Files</span>
        </div>
        <div class="flex flex-col items-center gap-1 group cursor-pointer" onclick="toggleWindow('browser')">
            <div class="p-3 rounded-lg group-hover:bg-white/10 transition">
                <i data-lucide="globe" class="w-10 h-10 text-blue-400"></i>
            </div>
            <span class="text-xs shadow-sm">Edge 2.0</span>
        </div>
    </div>

    <!-- Futuristic Window (Browser Example) -->
    <div id="window-browser" class="hidden absolute top-20 left-1/4 w-1/2 h-2/3 glass rounded-xl shadow-2xl flex flex-col overflow-hidden">
        <div class="flex justify-between items-center p-3 bg-white/5 border-b border-white/10">
            <span class="text-sm font-medium ml-2">Microsoft Edge</span>
            <div class="flex gap-4 px-2">
                <div class="w-3 h-3 rounded-full bg-yellow-400/50"></div>
                <div class="w-3 h-3 rounded-full bg-green-400/50"></div>
                <div class="w-3 h-3 rounded-full bg-red-400/50 cursor-pointer" onclick="toggleWindow('browser')"></div>
            </div>
        </div>
        <div class="flex-1 bg-white flex items-center justify-center text-gray-800">
            <div class="text-center">
                <h2 class="text-2xl font-bold">Windows 13</h2>
                <p class="text-gray-500">The web, redesigned for the future.</p>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="start-menu fixed bottom-16 left-1/2 -translate-x-1/2 w-[500px] h-[600px] glass rounded-2xl shadow-2xl p-8 z-50">
        <div class="mb-8">
            <input type="text" placeholder="Search apps, settings, and documents" class="w-full bg-black/20 border border-white/10 rounded-full py-2 px-4 outline-none focus:border-blue-500/50 transition">
        </div>
        <div class="grid grid-cols-4 gap-6">
            <div class="flex flex-col items-center gap-2 hover:bg-white/5 p-4 rounded-xl transition cursor-pointer">
                <i data-lucide="settings" class="w-8 h-8"></i>
                <span class="text-xs">Settings</span>
            </div>
            <div class="flex flex-col items-center gap-2 hover:bg-white/5 p-4 rounded-xl transition cursor-pointer">
                <i data-lucide="mail" class="w-8 h-8 text-blue-300"></i>
                <span class="text-xs">Mail</span>
            </div>
            <div class="flex flex-col items-center gap-2 hover:bg-white/5 p-4 rounded-xl transition cursor-pointer">
                <i data-lucide="terminal" class="w-8 h-8 text-green-400"></i>
                <span class="text-xs">Terminal</span>
            </div>
            <div class="flex flex-col items-center gap-2 hover:bg-white/5 p-4 rounded-xl transition cursor-pointer">
                <i data-lucide="play" class="w-8 h-8 text-red-400"></i>
                <span class="text-xs">Media</span>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="fixed bottom-0 w-full h-14 glass border-t border-white/10 flex items-center justify-between px-4 z-[100]">
        <div class="flex items-center gap-4 w-32">
            <div id="weather" class="text-xs flex items-center gap-2">
                <i data-lucide="sun" class="w-4 h-4"></i> 72°F
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleStart()" class="app-icon p-2 hover:bg-white/10 rounded-lg transition duration-200">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/Windows_logo_-_2021.svg" class="w-6 h-6" alt="Start">
            </button>
            <div class="w-[1px] h-6 bg-white/10 mx-1"></div>
            <button onclick="toggleWindow('browser')" class="app-icon p-2 hover:bg-white/10 rounded-lg transition">
                <i data-lucide="globe" class="w-6 h-6 text-blue-400"></i>
            </button>
            <button class="app-icon p-2 hover:bg-white/10 rounded-lg transition">
                <i data-lucide="message-square" class="w-6 h-6 text-purple-400"></i>
            </button>
        </div>

        <div class="flex items-center gap-4 w-32 justify-end text-xs">
            <div class="text-right">
                <div id="clock">12:00 PM</div>
                <div>5/9/2026</div>
            </div>
            <i data-lucide="wifi" class="w-4 h-4"></i>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Toggle Start Menu
        function toggleStart() {
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('open');
        }

        // Simple Window Toggle
        function toggleWindow(id) {
            const win = document.getElementById(`window-${id}`);
            if(win) {
                win.classList.toggle('hidden');
                // Close start menu if opening window
                document.getElementById('start-menu').classList.remove('open');
            }
        }

        // Live Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
